<style>
:root{--bg:#FFF9F2;--card:#FFFFFF;--border:rgba(15,23,42,0.07);--gold:#D97706;--green:#059669;--blue:#2563EB;--purple:#7C3AED;--red:#DC2626;--amber:#D97706;--txt:#1E293B;--txt2:#64748B;--txt3:#94A3B8;--glow:none;--shadow:0 2px 10px rgba(217,119,6,0.06),0 1px 3px rgba(15,23,42,0.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:var(--glow);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;transition:background .8s,background-image .8s;overscroll-behavior:none}
h1,h2,h3,.hf{font-family:'Outfit',sans-serif}
.lbl{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--txt3);font-family:'Outfit',sans-serif;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:border-color .5s}
.btn{border:none;border-radius:10px;padding:12px 20px;cursor:pointer;font-weight:700;font-size:14px;font-family:'Outfit',sans-serif;transition:transform .1s}
.btn:active{transform:scale(0.96)}
.inp{background:rgba(15,23,42,0.056);border:1px solid rgba(15,23,42,0.098);border-radius:8px;padding:12px;color:#1E293B;font-size:16px;font-family:'DM Sans',sans-serif;outline:none;width:100%}
.inp:focus{border-color:rgba(217,119,6,0.4)}
textarea.inp{resize:vertical;min-height:60px;font-size:14px;line-height:1.6}
.tab-content{animation:fadeIn .3s ease;padding:14px 16px 100px}
.ov{position:fixed;inset:0;background:rgba(255,249,242,0.97);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(16px)}
.ov-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#94A3B8;font-size:24px;cursor:pointer;z-index:210}
.habit-row{display:flex;align-items:center;gap:10px;padding:14px 14px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid rgba(15,23,42,0.056);transition:all .15s}
.habit-row.on{background:rgba(5,150,105,0.06);border-color:rgba(5,150,105,0.15)}
.habit-check{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .15s}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.96);box-shadow:0 -4px 20px rgba(15,23,42,0.06);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 16px;z-index:100}
.nav-btn{background:none;border:none;cursor:pointer;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#94A3B8;border-radius:10px;transition:all .2s;font-family:'Outfit',sans-serif}
.nav-btn.active{color:var(--gold);background:rgba(217,119,6,0.07)}
.nav-btn .icon{font-size:22px;font-weight:300}
.nav-btn .label{font-size:10px;font-weight:400}
.nav-btn.active .label{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slider-row{display:flex;gap:6px;margin-top:4px}
.slider-cell{flex:1;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;border:1px solid rgba(15,23,42,0.07);transition:all .15s}
.water-dot{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;border:1px solid rgba(15,23,42,0.056);transition:all .1s}
.water-dot.filled{background:rgba(37,99,235,0.12);border-color:rgba(37,99,235,0.2)}
.ex-row{border-left:4px solid var(--purple);padding:0;overflow:hidden}
.ex-header{padding:14px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ex-detail{padding:4px 14px 14px;border-top:1px solid rgba(15,23,42,0.042)}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.set-input{width:60px;text-align:center;padding:10px 4px;font-size:16px;border-radius:8px}
.progress-bar{background:rgba(15,23,42,0.07);border-radius:4px;height:5px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
.dot-row{display:flex;gap:4px;justify-content:center;margin-top:12px}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(15,23,42,0.14)}
.dot.done{background:var(--green)}.dot.active{background:var(--gold)}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(5,150,105,0.95);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;z-index:300;animation:toastIn .3s ease;pointer-events:none;white-space:nowrap}

.card{background:var(--card);box-shadow:var(--shadow)}
.inp{background:#fff;border:1px solid rgba(15,23,42,0.12);color:#1E293B}
.inp::placeholder{color:#94A3B8}
.inp:focus{border-color:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,0.15)}
.habit-row{background:#fff;border:1px solid rgba(15,23,42,0.06)}
.habit-row.on{background:#ECFDF5;border-color:#6EE7B7}
.nav-btn{color:#94A3B8}.nav-btn.active{color:#D97706;background:#FEF3C7}
.slider-cell,.water-dot{background:#fff}
.water-dot.filled{background:#DBEAFE;border-color:#93C5FD}
.progress-bar{background:#F1F5F9}
.dot{background:#E2E8F0}
.toast{background:#059669;color:#fff;box-shadow:0 8px 24px rgba(5,150,105,0.35)}
.ov{backdrop-filter:blur(20px)}
.ov-close{color:#64748B}
#header h1{color:#0F172A}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header" style="padding:16px 16px 0">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div class="lbl" style="color:var(--gold);margin-bottom:2px;font-size:9px">PHASE 1 · IGNITION</div>
      <h1 style="font-size:18px;font-weight:800;color:#0F172A;letter-spacing:-0.5px;font-family:'Outfit',sans-serif" id="appTitle">Wellness</h1>
    </div>
    <div style="font-size:12px;color:var(--txt3)" id="dateStr"></div>
  </div>
  <!-- Hero Score -->
  <div style="display:flex;justify-content:center;padding:20px 0 16px">
    <div style="position:relative;width:120px;height:120px">
      <svg width="120" height="120" style="transform:rotate(-90deg)">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(15,23,42,0.056)" stroke-width="8"/>
        <circle id="scoreRing" cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="8" stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round" style="transition:stroke-dashoffset 1s ease,stroke .3s"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span id="scoreNum" class="hf" style="font-size:36px;font-weight:800;color:#0F172A">0</span>
        <span style="font-size:10px;color:#64748B;margin-top:-2px">TODAY</span>
      </div>
    </div>
  </div>
</div>

<!-- TAB CONTENT CONTAINER -->
<div id="tabContent"></div>

<!-- NAV -->
<div class="nav" id="nav"></div>

<!-- OVERLAYS -->
<div id="overlayBreath" class="ov hidden"></div>
<div id="overlayFlow" class="ov hidden"></div>
<div id="overlayLetter" class="ov hidden"></div>
<div id="overlaySetup" class="ov hidden"></div>
<div id="overlayPorsche" class="ov hidden"></div>

<script>
/* ═══════════════════════════════════════
   KEYUR'S WELLNESS — HTML EDITION
   ═══════════════════════════════════════ */

// ── DATA ──
const INIT = {sw:0,tgt:0,v:3,days:{},wts:[],ar:"5k_walk",rw:1,por:{},ltr:""};
const HB = [
  {id:"wake",l:"Up on time",i:"☀️",g:0},{id:"pranayama",l:"Pranayama",i:"🌬️",g:1},
  {id:"exercise",l:"Exercise",i:"💪",g:2},{id:"water",l:"Water 10+",i:"💧",g:2},
  {id:"noJunk",l:"No junk",i:"🚫",g:3},{id:"homeFood",l:"Home dinner",i:"🏠",g:3},
  {id:"noAlc",l:"No alcohol",i:"🍷",g:3},{id:"sleepOk",l:"Slept ok",i:"🌙",g:4}
];
const GN=["ROUTINE","MIND","BODY","FUEL","REST"];
const MS=[{kg:108,r:"New Bike",i:"🏍️",c:"#D97706"},{kg:100,r:"BYD Sealion 7",i:"🚗",c:"#2563EB"},{kg:85,r:"Porsche",i:"🏎️",c:"#059669"}];
const PS=[{kg:115,s:"Model",o:["911 Carrera","Taycan","Cayenne"]},{kg:111,s:"Color",o:["Racing Yellow","GT Silver","Shark Blue","Black"]},{kg:106,s:"Interior",o:["Black Leather","Bordeaux Red","Espresso"]},{kg:101,s:"Wheels",o:['20" Carrera','21" Spyder']},{kg:95,s:"Tech",o:["Sport Chrono","Night Vision","PASM"]},{kg:85,s:"FULL SPEC",o:[]}];
const STR={
  Push:[{n:"Elliptical warm-up",p:"5m",t:"W"},{n:"Chest press machine",p:"3×10",t:"S"},{n:"Incline chest press",p:"3×10",t:"S"},{n:"Seated shoulder press",p:"3×10",t:"S"},{n:"DB lateral raise",p:"3×12",t:"S"},{n:"Tricep pushdown",p:"3×12",t:"S"},{n:"Plank hold",p:"3×30s",t:"K"}],
  Pull:[{n:"Row machine warm-up",p:"5m",t:"W"},{n:"Lat pulldown (wide)",p:"3×10",t:"S"},{n:"Seated cable row",p:"3×10",t:"S"},{n:"Single-arm DB row",p:"3×10",t:"S"},{n:"Face pull",p:"3×12",t:"S"},{n:"DB curl",p:"3×12",t:"S"},{n:"Dead bug",p:"3×10",t:"K"}],
  Legs:[{n:"Bike warm-up",p:"5m",t:"W"},{n:"Leg press",p:"3×10",t:"S"},{n:"Romanian DB deadlift",p:"3×10",t:"S"},{n:"Leg curl machine",p:"3×12",t:"S"},{n:"Leg extension",p:"3×12",t:"S"},{n:"Standing calf raise",p:"3×15",t:"S"},{n:"Hanging knee raise",p:"3×10",t:"K"}],
  Upper:[{n:"Bike warm-up",p:"5m",t:"W"},{n:"Flat DB chest press",p:"3×10",t:"S"},{n:"Close-grip lat pulldown",p:"3×10",t:"S"},{n:"Machine shoulder press",p:"3×10",t:"S"},{n:"Machine row",p:"3×10",t:"S"},{n:"Cable fly",p:"3×12",t:"S"},{n:"Rope tricep pushdown",p:"3×12",t:"S"},{n:"Cable crunch",p:"3×15",t:"K"}],
  Lower:[{n:"Elliptical warm-up",p:"5m",t:"W"},{n:"Goblet squat",p:"3×10",t:"S"},{n:"Walking lunges",p:"3×10/side",t:"S"},{n:"Leg curl",p:"3×12",t:"S"},{n:"Adductor/abductor machine",p:"3×12",t:"S"},{n:"Seated calf raise",p:"3×15",t:"S"},{n:"Bird-dog",p:"3×10",t:"K"}]
};
const STRN=["Push","Pull","Legs","Upper","Lower"];
const TRV=[{n:"Brisk walk 5 km",p:"50m",t:"C"},{n:"Push-ups",p:"3×12",t:"C"},{n:"Bodyweight squats",p:"3×20",t:"C"},{n:"Reverse lunges",p:"3×10/side",t:"C"},{n:"Glute bridge",p:"3×15",t:"C"},{n:"Plank",p:"3×40s",t:"C"},{n:"Burpees",p:"3×8",t:"C"}];
const TRAVEL_RULES=["🥤 Carry whey sachets + roasted chana — protein holds at 150 g","🍛 Dal / paneer / curd / eggs + sabzi. Skip rice, naan, dessert, buffet starters","🍷 Zero alcohol, or one drink max","🚶 5 km walk + 30-min room circuit (Move tab)","⚖️ Travel weigh-ins stay out of the 7-day trend"];
// ── PLAN · 120 → 95 kg by 3 Mar 2027 → 85 kg by 3 Sep 2027
const PL={s:"2026-10-13",sw:120,ramp:"2026-10-22",m:"2027-03-03",mw:95,e:"2027-09-03",gw:85};
const CK=["2026-11-13","2026-12-13","2027-01-13","2027-02-13","2027-03-03","2027-05-03","2027-07-03","2027-09-03"];
function isK(){return !!(D.pf&&D.pf.k)}
function monthly(s,e){const out=[];const d=new Date(s+"T12:00:00"),day=d.getDate();for(let i=1;i<=36;i++){const x=new Date(d);x.setDate(1);x.setMonth(d.getMonth()+i);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));const k=x.toISOString().slice(0,10);if(k>=e)break;out.push(k);}out.push(e);return out}
function plan(){
  if(isK())return{pts:[[PL.s,PL.sw],[PL.m,PL.mw],[PL.e,PL.gw]],s:PL.s,sw:PL.sw,gw:PL.gw,ramp:PL.ramp,ck:CK,str:5,sport:3,prot:150,h:183,head:"120 → 95 BY 3 MAR → 85 BY 3 SEP"};
  const f=D.pf||{sd:tod(),sw:getCW()||100,gw:getCW()||100,gd:tod(),str:3,sport:2,prot:120,h:170};
  return{pts:[[f.sd,f.sw],[f.gd,f.gw]],s:f.sd,sw:f.sw,gw:f.gw,ramp:"",ck:monthly(f.sd,f.gd),str:f.str,sport:f.sport,prot:f.prot,h:f.h,head:`${f.sw} → ${f.gw} KG BY ${fmtD(f.gd).toUpperCase()}`};
}
function dnum(k){return Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/86400000}
function kOf(n){return new Date(n*86400000).toISOString().slice(0,10)}
function planW(k){const P=plan(),t=dnum(k),q=P.pts;if(t<=dnum(q[0][0]))return q[0][1];for(let i=1;i<q.length;i++){const a=dnum(q[i-1][0]),b=dnum(q[i][0]);if(t<=b)return +(q[i-1][1]+(q[i][1]-q[i-1][1])*(t-a)/Math.max(1,b-a)).toFixed(1);}return P.gw}
function avg7(k){const t=dnum(k||tod());const v=D.wts.filter(x=>!x.tr&&dnum(x.d)<=t&&dnum(x.d)>t-7);if(!v.length)return null;return +(v.reduce((a,x)=>a+x.w,0)/v.length).toFixed(1)}
function calBand(){const k=tod();
  if(isK()){if(k<=PL.ramp)return{t:1800,l:"Walk-only days · till 22 Oct"};const w=avg7()||getCW();return w>112?{t:2000,l:"120–112 kg band"}:w>104?{t:1900,l:"112–104 kg band"}:w>95?{t:1800,l:"104–95 kg band"}:{t:2300,l:"95–85 kg phase"};}
  const f=D.pf;if(!f)return{t:2000,l:""};const w=avg7()||getCW()||f.sw,bmr=10*w+6.25*f.h-5*f.age+(f.sex==='F'?-161:5),tdee=bmr*1.55;
  const days=Math.max(28,dnum(f.gd)-dnum(f.sd)),def=Math.min(1000,Math.max(0,(f.sw-f.gw)*7700/days));
  let t=Math.round((tdee-def)/50)*50;t=Math.max(f.sex==='F'?1200:1500,t);return{t,l:"Your daily target"}}
function calTarget(){return calBand().t}
function behindAlert(){const t=dnum(tod()),st=plan().s;for(let i=0;i<14;i++){const k=kOf(t-i);if(k<st)return false;const a=avg7(k);if(a===null||a-planW(k)<=1)return false;}return true}
function fmtD(k){return new Date(k+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:k.slice(0,4)===tod().slice(0,4)?undefined:"numeric"})}
function weekKeys(){const t=dnum(tod()),dow=(new Date(tod()+"T12:00:00").getDay()+6)%7;return Array.from({length:7},(_,i)=>kOf(t-dow+i))}
function weekStats(){let str=0,sport=0,walk=0,steps=0;weekKeys().forEach(k=>{const d=D.days[k];if(!d)return;Object.values(d.ex||{}).forEach(x=>{if(x.t!=='F')return;if(x.k==='str')str++;else if(x.k==='sport')sport++;else if(x.k==='walk')walk++;});if((d.steps||0)>=10000)steps++;});return{str,sport,walk,steps}}
function strDoneToday(){return Object.values(getDay().ex||{}).find(x=>x.t==='F'&&x.k==='str')}
function nextStr(){let n=0;Object.keys(D.days).filter(k=>k<tod()).forEach(k=>Object.values(D.days[k].ex||{}).forEach(x=>{if(x.t==='F'&&x.k==='str'&&STR[x.n])n++;}));return STRN[n%STRN.length]}
const BRX=[{name:"Anulom Vilom",sec:300,d:"Calms nerves",st:["Close right nostril","Inhale left 4 counts","Close left nostril","Exhale right 4 counts","10 full rounds"]},{name:"Kapalbhati",sec:180,d:"Burns belly fat",st:["Sharp exhale, belly IN","Passive inhale","20 strokes × 3 rounds"]},{name:"Bhramari",sec:120,d:"Kills anxiety instantly",st:["Close ears with thumbs","Deep inhale","Exhale with HUMMM","5-7 rounds"]},{name:"Box Breathing",sec:180,d:"Navy SEAL reset",st:["Inhale 4, Hold 4","Exhale 4, Hold 4","6-8 rounds"]}];
const MLs={"☀️ Pre-workout 7:20":["500ml water + pinch of salt + black coffee ~5 kcal","1 small date if low energy ~20 kcal"],"🌅 Post-workout Breakfast 9:45":["Whey 30g + 3 egg-white + 1 whole-egg omelette + 2 moong dal cheela + curd (100g) ~520 kcal 45g protein","Whey 30g + oats (50g) cooked in milk + 10 almonds + 1 apple + 2 egg whites ~520 kcal 40g protein","Whey 30g + paneer bhurji (100g) + 2 multigrain roti + salad ~500 kcal 42g protein"],"🍱 Lunch 1PM":["2 multigrain roti + dal + sabzi + salad + curd (100g) ~500 kcal 30g protein","Brown rice (1 katori) + rajma/chole + sabzi + salad ~480 kcal 28g protein","Khichdi (1.5 katori) + kadhi + salad + 2 boiled eggs ~520 kcal 32g protein"],"🍵 Snack 5PM":["Greek yogurt (150g) + 10 almonds ~180 kcal 14g protein","Roasted chana (30g) + green tea ~110 kcal 7g protein","2 boiled eggs + cucumber ~160 kcal 13g protein"],"🌙 Dinner 8:30PM (light)":["Moong dal + sabzi + 1 roti + salad ~380 kcal 25g protein","Veg khichdi (1 katori) + curd + salad ~360 kcal 20g protein","Grilled paneer (100g) + stir-fry veg + salad ~400 kcal 28g protein"],"💪 Post-dinner (training days only)":["Whey 25g in water ~120 kcal 25g protein"]};
const MRN=[{l:"Get out of bed",i:"🛏️",d:0},{l:"Bathroom + face wash",i:"🚿",d:0},{l:"Glass of warm water",i:"💧",d:0},{l:"Go to balcony",i:"🌅",d:0},{l:"Anulom Vilom",i:"🌬️",d:180},{l:"Sit with eyes closed",i:"🧘",d:120},{l:"You're ready. Go conquer.",i:"⚡",d:0}];
const EVN=[{l:"Phone OUTSIDE bedroom",i:"📱",d:0},{l:"Dim all lights",i:"🔅",d:0},{l:"Brain dump: 3 worries → notebook",i:"📓",d:300},{l:"Bhramari breathing",i:"🐝",d:120},{l:"Lights out. Eyes closed.",i:"🌙",d:0}];
const RC=[{id:"5k_walk",n:"5K Walk",i:"🚶",c:"#EA580C",u:999,w:6,p:["Walk 20 min easy","Walk 25 min","Walk 30 min","Walk 35 min + jog 2","Walk 30 + jog 5","5K test day"]},{id:"5k_run",n:"5K Run",i:"🏃",c:"#2563EB",u:108,w:8,p:["Run1/Walk2 ×8","Run2/Walk1 ×7","Run3/Walk1 ×6","Run4/Walk1 ×5","Run5/Walk1 ×4","Run 8min ×3","Run 12min ×2","5K test"]},{id:"10k",n:"10K",i:"🏃‍♂️",c:"#7C3AED",u:105,w:8,p:["6K run","7K run","6K + speed work","8K run","7K + tempo","9K run","8K + speed","10K race"]},{id:"half",n:"Half Marathon",i:"🏅",c:"#DB2777",u:100,w:12,p:["10K easy","11K","12K + tempo","11K easy","13K","14K + hills","12K recovery","15K","16K + tempo","14K easy","18K long","21.1K race!"]},{id:"hyrox",n:"Hyrox",i:"💪",c:"#DC2626",u:95,w:10,p:["5K + sled intro","1K×4 + wall balls","Rowing + burpees","1K×4 + farmer carry","Sled pull + lunges","Half simulation","1K×6 all stations","Full sim 75%","Taper","Race day!"]},{id:"70.3",n:"Ironman 70.3",i:"🏊",c:"#0891B2",u:90,w:16,p:["Swim 400m + Bike 20K + Run 5K","S600+B25+R6","S800+B30+R8","Recovery","S1K+B40+R10","S1.2K+B45+R10","S1.4K+B50+R12","Recovery","S1.5K+B55+R14","S1.6K+B65+R15","Recovery","S1.7K+B70+R16","S1.8K+B75+R18","Recovery","Taper","Race day!"]}];

// ── UTILS ──
function tod(){return new Date().toISOString().split("T")[0]}
function cl(v,a,b){return Math.max(a,Math.min(b,v))}
function hsc(day){if(!day||!day.h)return 0;return Math.round(Object.values(day.h).filter(Boolean).length/HB.length*100)}
function eDay(){return{h:{},water:0,steps:0,note:"",meals:[],ex:{},br:[],mood:0,energy:0,stress:0,bed:"",wake:""}}
function bioA(bmi,act,slp,str,alc){let o=0;o+=bmi>35?8:bmi>30?5:bmi>25?2:-1;o+=act<1?4:act>=5?-2:0;o+=slp<5?4:slp>=7?-1:0;o+=str>=4?3:str<3?-1:0;o+=alc>=3?3:alc<1?-1:0;return getChronoAge()+o}
function getChronoAge(){const b=new Date(1983,8,3),now=new Date();let age=now.getFullYear()-b.getFullYear();if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))age--;return age;}
function lerp(a,b,t){return a+(b-a)*cl(t,0,1)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function futureStamp(){const d=new Date();d.setMonth(d.getMonth()+12);return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function timeStr(){return new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

// Storage — localStorage for standalone, window.storage for artifact
async function loadData(){
  try{
    if(window.storage){const r=await window.storage.get("kw-html-2");if(r&&r.value){D=JSON.parse(r.value);return;}}
  }catch(e){}
  try{const s=localStorage.getItem("kw-html-2");if(s)D=JSON.parse(s);}catch(e){}
  if(D.ltr&&/August 2026/.test(D.ltr))D.ltr="";
  if(D.v!==3){D.v=3;delete D.pf;saveData();}
  if(D.ltr&&/hip|90 ?kg/i.test(D.ltr))D.ltr="";
}
async function saveData(){
  try{localStorage.setItem("kw-html-2",JSON.stringify(D));}catch(e){}
  try{if(window.storage)await window.storage.set("kw-html-2",JSON.stringify(D));}catch(e){}
}

function getDay(date){return D.days[date||tod()]||eDay()}
function setDay(fn){
  const k=tod();
  if(!D.days[k])D.days[k]=eDay();
  D.days[k]=fn(D.days[k]);
  saveData();
  render();
}
function getCW(){return D.wts.length?D.wts[D.wts.length-1].w:D.sw}
function getStreak(){
  let s=0,d=new Date();
  for(let i=0;i<365;i++){const k=d.toISOString().split("T")[0];if(D.days[k]&&hsc(D.days[k])>=54){s++;d.setDate(d.getDate()-1);}else break;}
  return s;
}
function getVit(){
  let t=0,n=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const dd=D.days[d.toISOString().split("T")[0]];if(dd){t+=hsc(dd)/100;n++;}}
  return n?t/n:0;
}
function getAI(){
  const v=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const dd=D.days[d.toISOString().split("T")[0]];if(dd)v.push(dd);}
  if(v.length<2)return[{t:"Log 2+ days for AI insights",c:"#64748B"}];
  const ins=[];
  const alc=v.filter(d=>!d.h?.noAlc).length;
  if(alc>2)ins.push({t:"🍷 Alcohol "+alc+"/7 days — each session ≈ 500 empty kcal + wrecked sleep",c:"#DC2626"});
  const pr=v.filter(d=>d.h?.pranayama).length;
  if(pr<3)ins.push({t:"🌬️ Pranayama only "+pr+"/7 days. Your stress stays elevated without it.",c:"#7C3AED"});
  else if(pr>=5)ins.push({t:"🌬️ Pranayama "+pr+"/7 — excellent consistency!",c:"#059669"});
  const hd=v.filter(d=>d.h?.homeFood).length;
  if(hd<4)ins.push({t:"🏠 Home dinner only "+hd+"/7 days. Each outside meal ≈ +400 kcal.",c:"#EA580C"});
  const avgS=v.filter(d=>d.stress).length?v.reduce((a,d)=>a+(d.stress||0),0)/v.filter(d=>d.stress).length:0;
  if(avgS>=4)ins.push({t:"😰 Avg stress "+(avgS).toFixed(1)+"/5 — exercise + pranayama days show 40% lower.",c:"#DC2626"});
  return ins.length?ins:[{t:"✨ Strong week. Keep showing up.",c:"#059669"}];
}
function getBio(){
  const cw=getCW(),bmi=cw/Math.pow(plan().h/100,2),v=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const dd=D.days[d.toISOString().split("T")[0]];if(dd)v.push(dd);}
  const act=v.filter(d=>d.h?.exercise).length;
  const avgStr=v.filter(d=>d.stress).length?v.reduce((a,d)=>a+(d.stress||0),0)/v.filter(d=>d.stress).length:4;
  const alc=v.filter(d=>!d.h?.noAlc).length;
  return bioA(bmi,act,5.5,avgStr,alc);
}
function MSx(){return isK()?MS:[{kg:plan().gw,r:"Goal "+plan().gw+" kg",i:"🎯",c:"#059669"}]}
function getTimeMachine(){
  const cw=getCW();
  if(D.wts.length<2){
    return{rate:0,dates:MSx().map(m=>{const need=cw-m.kg;return{...m,dt:need<=0?"DONE ✅":"Log daily to predict"};}),msg:"⏳ Log weight for 3+ days to see predicted arrival dates"};
  }
  const r=D.wts.slice(-14);if(r.length<2)return{rate:0,dates:MSx().map(m=>({...m,dt:"Need more data"})),msg:"⏳ Keep logging weight daily"};
  const days=(new Date(r[r.length-1].d)-new Date(r[0].d))/86400000||1;
  const rate=(r[0].w-r[r.length-1].w)/days;
  if(rate<=0)return{rate:0,dates:MSx().map(m=>{const need=cw-m.kg;return{...m,dt:need<=0?"DONE ✅":"STALLED ⚠️"};}),msg:"⚠️ Weight not dropping. Tighten diet + move more."};
  return{rate,dates:MSx().map(m=>{const need=cw-m.kg;if(need<=0)return{...m,dt:"DONE ✅"};const d=new Date();d.setDate(d.getDate()+Math.ceil(need/rate));return{...m,dt:d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};})};
}
function getNM(){const cw=getCW();return MS.find(m=>cw>m.kg)||MS[MS.length-1]}
function getAR(){return RC.find(r=>r.id===D.ar)||RC[0]}

// ── LIVING UI ──
function updateLivingUI(){
  const v=getVit();
  document.body.style.background='#FFF9F2';
  const col=v>0.7?"5,150,105":v>0.4?"217,119,6":"251,146,60";
  const a=(0.10+v*0.12).toFixed(2);
  document.body.style.backgroundImage=`radial-gradient(ellipse 120% 60% at 50% -10%,rgba(${col},${a}) 0%,rgba(253,224,71,0.06) 35%,transparent 70%)`;
  document.body.style.backgroundAttachment='fixed';
  document.documentElement.style.setProperty('--border',`rgba(15,23,42,${lerp(0.06,0.12,v).toFixed(2)})`);
}

// ── HEADER UPDATE ──
function updateHeader(){
  const tt=document.getElementById('appTitle');if(tt)tt.textContent=(D.pf&&D.pf.n?D.pf.n+"'s ":"")+"Wellness";
  document.getElementById('dateStr').textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const sc=hsc(getDay());
  const ring=document.getElementById('scoreRing');
  ring.setAttribute('stroke-dashoffset',326.7-cl(sc,0,100)/100*326.7);
  ring.setAttribute('stroke',sc>=80?'#059669':sc>=50?'#D97706':'#DC2626');
  document.getElementById('scoreNum').textContent=sc;
}

// ── TAB RENDERING ──
function render(){
  if(!D.pf){openSetup();return;}
  updateHeader();
  updateLivingUI();
  const el=document.getElementById('tabContent');
  el.className='tab-content';
  el.innerHTML=tabs[currentTab]();
  // Destroy old charts
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});
  charts={};
  // Init charts if on stats tab
  if(currentTab==='stats')setTimeout(initCharts,50);
}

function switchTab(id){
  currentTab=id;
  render();
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===id);
  });
}

let audioCtx_=null;
function playChime(){
  try{
    if(!audioCtx_)audioCtx_=new(window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx_.currentTime;
    [880,1320].forEach((f,i)=>{const o=audioCtx_.createOscillator(),g=audioCtx_.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioCtx_.destination);const s=now+i*0.08;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.28,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+1.8);o.start(s);o.stop(s+2);});
    setTimeout(()=>{if(!audioCtx_)return;const o=audioCtx_.createOscillator(),g=audioCtx_.createGain();o.type='sine';o.frequency.value=660;o.connect(g);g.connect(audioCtx_.destination);const n=audioCtx_.currentTime;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.22,n+0.01);g.gain.exponentialRampToValueAtTime(0.0001,n+2);o.start(n);o.stop(n+2.2);},2200);
  }catch(e){}
}
function startBreath(name){
  const tech=BRX.find(b=>b.name===name);if(!tech)return;
  const ov=document.getElementById('overlayBreath');
  let el=0,run=false;
  function renderTimer(){
    const done=el>=tech.sec&&el>0,rm=tech.sec-el;
    const pct=tech.sec>0?(el/tech.sec*100):0;
    const ringR=60,ringC=2*Math.PI*ringR;
    ov.innerHTML=`<button class="ov-close" onclick="closeBreath()" style="font-size:28px">✕</button>
      <div class="hf" style="font-size:14px;letter-spacing:4px;color:#64748B;margin-bottom:24px">${esc(tech.name.toUpperCase())}</div>
      <div style="position:relative;width:160px;height:160px;margin-bottom:24px">
        <svg width="160" height="160" style="transform:rotate(-90deg)">
          <circle cx="80" cy="80" r="${ringR}" fill="none" stroke="rgba(15,23,42,0.056)" stroke-width="4"/>
          <circle cx="80" cy="80" r="${ringR}" fill="none" stroke="${done?'#059669':'#D97706'}" stroke-width="4" stroke-dasharray="${ringC}" stroke-dashoffset="${ringC-pct/100*ringC}" stroke-linecap="round" style="transition:stroke-dashoffset 0.5s"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          ${done?`<div style="font-size:48px">✨</div><div class="hf" style="font-size:14px;color:#059669;margin-top:4px">DONE</div>`
          :`<div class="hf" style="font-size:44px;font-weight:200;color:#0F172A">${Math.floor(rm/60)}:${(rm%60).toString().padStart(2,'0')}</div>`}
        </div>
      </div>
      <button style="width:72px;height:72px;border-radius:50%;border:3px solid ${run?'#DC2626':done?'#059669':'#D97706'};background:${run?'rgba(220,38,38,0.06)':done?'rgba(5,150,105,0.06)':'rgba(217,119,6,0.06)'};color:${run?'#DC2626':done?'#059669':'#D97706'};font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="toggleBreath()">${run?'❚❚':done?'✓':'▶'}</button>
      ${!run&&!done?`<div style="margin-top:28px;max-width:280px;text-align:center">${tech.st.map((s,i)=>`<div style="font-size:14px;color:#94A3B8;line-height:2">${i+1}. ${esc(s)}</div>`).join('')}</div>`:''}
      ${done?`<div class="hf" style="margin-top:16px;font-size:13px;color:#64748B">Tap ✓ to log</div>`:''}`;
    ov.classList.remove('hidden');
  }
  window.toggleBreath=()=>{
    if(el>=tech.sec){
      toast('🧘 '+tech.name+' complete');
      setDay(c=>({...c,br:[...(c.br||[]),{n:tech.name,a:timeStr()}]}));
      closeBreath();return;
    }
    run=!run;
    if(run){breathInterval=setInterval(()=>{el++;if(el>=tech.sec){run=false;clearInterval(breathInterval);playChime();}renderTimer();},1000);}
    else{clearInterval(breathInterval);}
    renderTimer();
  };
  window.closeBreath=()=>{clearInterval(breathInterval);ov.classList.add('hidden');run=false;el=0;};
  renderTimer();
}

// ── GUIDED FLOW ──
function startFlow(type){
  const steps=type==='morning'?MRN:EVN;
  const title=type==='morning'?'MORNING RUNWAY':'EVENING WIND-DOWN';
  const ov=document.getElementById('overlayFlow');
  let ci=0,tm=0,run=false,t0=Date.now();
  function renderFlow(){
    const s=steps[ci],rm=s.d?s.d-tm:0,last=ci===steps.length-1;
    ov.innerHTML=`<button class="ov-close" onclick="closeFlow()">✕</button>
      <div class="hf" style="font-size:10px;letter-spacing:3px;color:#D97706">${title} · ${ci+1}/${steps.length}</div>
      <div style="font-size:48px;margin:20px 0">${s.i}</div>
      <div class="hf" style="font-size:20px;font-weight:700;color:#0F172A;text-align:center;max-width:260px">${esc(s.l)}</div>
      ${s.d>0?`<div class="hf" style="font-size:32px;font-weight:200;color:#0F172A;margin:16px 0">${Math.floor(rm/60)}:${(rm%60).toString().padStart(2,'0')}</div>
        ${tm<s.d?`<button class="btn" style="padding:6px 20px;border-radius:14px;border:1px solid #2563EB;background:rgba(37,99,235,0.1);color:#2563EB" onclick="toggleFlow()">${run?'Pause':'Start Timer'}</button>`:''}`:''}
      <button class="btn" style="margin-top:20px;padding:12px 32px;background:${last?'linear-gradient(135deg,#047857,#059669)':s.d&&tm<s.d?'#E2E8F0':'#D97706'};color:${last||!s.d||tm>=s.d?'#fff':'#94A3B8'};font-size:15px;opacity:${s.d&&tm<s.d?0.4:1}" onclick="nextFlowStep()">${last?'✨ Complete':'Next →'}</button>
      <div class="dot-row">${steps.map((_,j)=>`<div class="dot ${j<ci?'done':j===ci?'active':''}"></div>`).join('')}</div>`;
    ov.classList.remove('hidden');
  }
  window.toggleFlow=()=>{
    run=!run;
    if(run){flowInterval=setInterval(()=>{tm++;if(tm>=steps[ci].d){run=false;clearInterval(flowInterval);}renderFlow();},1000);}
    else{clearInterval(flowInterval);}
    renderFlow();
  };
  window.nextFlowStep=()=>{
    clearInterval(flowInterval);run=false;
    if(ci<steps.length-1){ci++;tm=0;renderFlow();}
    else{
      const mins=Math.round((Date.now()-t0)/60000);
      if(type==='morning')setDay(c=>({...c,h:{...c.h,wake:true,noDrift:mins<=30}}));
      closeFlow();
    }
  };
  window.closeFlow=()=>{clearInterval(flowInterval);ov.classList.add('hidden');run=false;};
  renderFlow();
}

          <div><div style="font-size:9px;color:#64748B;letter-spacing:1.5px;font-family:Outfit,sans-serif">INTERIOR</div><div style="font-size:15px;color:#0F172A;font-weight:600;margin-top:2px">${esc(por.Interior)}</div></div>
        </div>`:''}
        ${por.Wheels?`<div style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid rgba(15,23,42,0.042)">
          <div style="width:44px;height:44px;border-radius:50%;border:3px solid #64748B;display:flex;align-items:center;justify-content:center;position:relative"><div style="width:22px;height:22px;border-radius:50%;border:2px solid #94A3B8"></div><div style="position:absolute;width:2px;height:100%;background:#77777740;transform:rotate(45deg)"></div><div style="position:absolute;width:2px;height:100%;background:#77777740;transform:rotate(-45deg)"></div><div style="position:absolute;width:2px;height:100%;background:#77777740"></div></div>
          <div><div style="font-size:9px;color:#64748B;letter-spacing:1.5px;font-family:Outfit,sans-serif">WHEELS</div><div style="font-size:15px;color:#0F172A;font-weight:600;margin-top:2px">${esc(por.Wheels)}</div></div>
        </div>`:''}
        ${por.Tech?`<div style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid rgba(15,23,42,0.042)">
          <div style="width:44px;height:44px;border-radius:12px;background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.2);display:flex;align-items:center;justify-content:center;font-size:18px">⚡</div>
          <div><div style="font-size:9px;color:#64748B;letter-spacing:1.5px;font-family:Outfit,sans-serif">TECHNOLOGY</div><div style="font-size:15px;color:#0F172A;font-weight:600;margin-top:2px">${esc(por.Tech)}</div></div>
        </div>`:''}
        ${por.Accent?`<div style="display:flex;align-items:center;gap:16px;padding:10px 0">
          <div style="width:44px;height:44px;border-radius:12px;background:rgba(217,119,6,0.1);border:1px solid rgba(217,119,6,0.2);display:flex;align-items:center;justify-content:center;font-size:18px">✦</div>
          <div><div style="font-size:9px;color:#64748B;letter-spacing:1.5px;font-family:Outfit,sans-serif">ACCENT</div><div style="font-size:15px;color:#0F172A;font-weight:600;margin-top:2px">${esc(por.Accent)}</div></div>
        </div>`:''}
        ${Object.keys(por).length===0?`<div style="text-align:center;padding:20px 0"><div style="font-size:40px;opacity:0.15;margin-bottom:8px">🔒</div><div style="font-size:13px;color:#94A3B8">Your configuration will appear here as you unlock steps</div></div>`:''}
      </div>
    </div>
    ${Object.keys(por).length?`<div class="card" style="background:rgba(217,119,6,0.03);border-color:rgba(217,119,6,0.12)"><div class="lbl" style="color:#D97706">SPEC SHEET</div>
      ${["Model","Color","Interior","Wheels","Tech","Accent"].filter(k=>por[k]).map(k=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(15,23,42,0.042)"><span style="color:#64748B;font-size:13px">${k}</span><span style="color:#1E293B;font-size:14px;font-weight:600">${k==="Color"?`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${bodyColor};vertical-align:middle;margin-right:6px"></span>`:``}${esc(por[k])}</span></div>`).join('')}
    </div>`:``}`;
  PS.forEach(p=>{
    const ok=cw<=p.kg,ch=por[p.s],act=ok&&!ch&&p.o.length>0;
    const colorMap={"Racing Yellow":"#F5C518","GT Silver":"#A8B0B8","Shark Blue":"#1A5276","Black":"#1a1a1a","Black Leather":"#1a1a1a","Bordeaux Red":"#6B1C2A","Espresso":"#3E2723"};
    html+=`<div class="card" style="border-color:${ch?'rgba(5,150,105,0.15)':act?'rgba(217,119,6,0.15)':'rgba(15,23,42,0.056)'};background:${ch?'rgba(5,150,105,0.04)':act?'rgba(217,119,6,0.04)':'rgba(15,23,42,0.028)'}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="hf" style="font-size:15px;font-weight:700;color:${ch?'#059669':act?'#D97706':'#94A3B8'}">${esc(p.s)}</span><span style="font-size:11px;color:#94A3B8">${ok?'✅ Unlocked':'🔒 '+p.kg+'kg'}</span></div>
      ${ch?`<div style="font-size:14px;color:#059669;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:8px">${colorMap[ch]?`<div style="width:20px;height:20px;border-radius:50%;background:${colorMap[ch]};border:2px solid rgba(15,23,42,0.14)"></div>`:``}✓ ${esc(ch)}</div>`:''}
      ${act?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${p.o.map(o=>{
        const cc=colorMap[o];
        return cc
          ?`<button class="btn" style="padding:12px 18px;font-size:13px;border:1px solid rgba(217,119,6,0.3);background:rgba(217,119,6,0.06);color:#D97706;display:flex;align-items:center;gap:8px" onclick="choosePorsche('${esc(p.s)}','${esc(o)}')"><div style="width:18px;height:18px;border-radius:50%;background:${cc};border:2px solid rgba(15,23,42,0.21)"></div>${esc(o)}</button>`
          :`<button class="btn" style="padding:12px 18px;font-size:13px;border:1px solid rgba(217,119,6,0.3);background:rgba(217,119,6,0.06);color:#D97706" onclick="choosePorsche('${esc(p.s)}','${esc(o)}')">${esc(o)}</button>`;
      }).join('')}</div>`:''}
      ${!ok?`<div style="font-size:12px;color:#94A3B8;margin-top:6px">Lose ${(cw-p.kg).toFixed(1)} more kg to unlock</div>`:''}
    </div>`;
  });
  html+=`</div>`;ov.innerHTML=html;ov.classList.remove('hidden');
}
function choosePorsche(step,choice){
  D.por={...D.por,[step]:choice};saveData();showPorsche();
}

// ── SETUP · each phone sets its own plan ──
let sxSex='M';
function openSetup(){
  const f=D.pf&&!D.pf.k?D.pf:{},ov=document.getElementById('overlaySetup');
  const gd=f.gd||(()=>{const d=new Date();d.setMonth(d.getMonth()+6);return d.toISOString().slice(0,10)})();
  sxSex=f.sex||'M';
  const fld=(id,l,v,t,ph)=>`<label style="display:block;margin-bottom:12px"><div class="lbl" style="margin-bottom:5px">${l}</div><input id="${id}" class="inp" type="${t||'number'}" ${t?'':'inputmode="decimal" step="0.1"'} value="${v===undefined?'':v}" placeholder="${ph||''}" style="font-size:17px;padding:13px"></label>`;
  ov.innerHTML=`<div style="max-width:380px;width:100%;max-height:92vh;overflow-y:auto;padding:4px 16px 24px">
    ${D.pf?`<button class="ov-close" onclick="closeSetup()">✕</button>`:''}
    <div class="hf" style="font-size:24px;font-weight:800;color:#0F172A;margin:10px 0 4px">Set up your plan</div>
    <div style="font-size:14px;color:#64748B;margin-bottom:18px">Stays on this phone. Your targets, calories and checkpoints are worked out from this.</div>
    ${fld('sxN','YOUR NAME',f.n,'text','First name')}
    <div class="lbl" style="margin-bottom:5px">SEX</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">${['M','F'].map(x=>`<button id="sx${x}" onclick="sxSex='${x}';document.getElementById('sxM').style.cssText=sxBtn(sxSex==='M');document.getElementById('sxF').style.cssText=sxBtn(sxSex==='F')" style="${sxBtn(sxSex===x)}">${x==='M'?'Male':'Female'}</button>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${fld('sxA','AGE',f.age)}${fld('sxH','HEIGHT (CM)',f.h)}${fld('sxW','WEIGHT NOW (KG)',f.sw||(getCW()||''))}${fld('sxG','GOAL (KG)',f.gw)}</div>
    ${fld('sxD','REACH GOAL BY',gd,'date')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${fld('sxS','STRENGTH / WEEK',f.str||3)}${fld('sxP','SPORT / WEEK',f.sport||2)}</div>
    <div id="sxErr" style="color:#DC2626;font-size:13px;min-height:18px;margin:2px 0 8px"></div>
    <button class="btn" style="width:100%;background:#059669;color:#fff;padding:15px;font-size:16px" onclick="saveSetup()">Start my plan</button>
  </div>`;
  ov.classList.remove('hidden');
}
function sxBtn(on){return `flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;border:1px solid ${on?'#059669':'rgba(15,23,42,0.1)'};background:${on?'rgba(5,150,105,0.1)':'#fff'};color:${on?'#059669':'#64748B'}`}
function closeSetup(){document.getElementById('overlaySetup').classList.add('hidden');}
function saveSetup(){
  const v=id=>document.getElementById(id).value.trim(),num=id=>parseFloat(v(id)),err=m=>{document.getElementById('sxErr').textContent=m};
  const n=v('sxN');if(!n)return err('Enter your name');
  if(/^keyur$/i.test(n)){D.pf={n:'Keyur',k:true};D.sw=PL.sw;D.tgt=PL.gw;saveData();closeSetup();initNav();render();return;}
  const age=num('sxA'),h=num('sxH'),w=num('sxW'),g=num('sxG'),gd=v('sxD'),st=Math.round(num('sxS')),sp=Math.round(num('sxP'));
  if(!(age>=15&&age<=90))return err('Enter your age');
  if(!(h>=120&&h<=230))return err('Enter height in cm');
  if(!(w>=35&&w<=250))return err('Enter your weight now');
  if(!(g>=35&&g<=250))return err('Enter your goal weight');
  if(!gd||gd<=tod())return err('Pick a goal date in the future');
  const days=dnum(gd)-dnum(tod()),rate=(w-g)/days*7;
  if(rate>1.0)return err('That needs '+rate.toFixed(1)+' kg/week. Pick a later date (max ~1 kg/week).');
  const keep=D.pf&&!D.pf.k&&D.pf.sw===w?D.pf.sd:tod();
  D.pf={n,sex:sxSex,age,h,sw:w,gw:g,gd,sd:keep,str:st>0?Math.min(7,st):3,sport:sp>=0?Math.min(7,sp):2,prot:Math.min(180,Math.max(80,Math.round(g*1.6/5)*5))};
  D.sw=w;D.tgt=g;
  if(D.wts.length===1&&D.wts[0].d==='2026-10-13'&&D.wts[0].w===120)D.wts=[];
  if(!D.wts.some(x=>x.d===tod()))D.wts.push({d:tod(),w});
  D.wts.sort((a,b)=>a.d<b.d?-1:1);
  saveData();closeSetup();initNav();render();toast('✓ Plan set');
}

// ── SYNC ──
function dlBlob(txt,name,mime){const b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("📤 "+name+" downloaded");}
function exportCSV(){
  const wmap={};D.wts.forEach(p=>{wmap[p.d]=p.w});
  const rows=[["date","weight_kg","score_pct","water_glasses","steps","calories","mood","energy","stress","bed","wake","habits_done","note"]];
  Object.keys(D.days).sort().forEach(k=>{const d=D.days[k];
    const cals=(d.meals||[]).reduce((a,m)=>a+(parseCal(m.x)||0),0);
    rows.push([k,wmap[k]!==undefined?wmap[k]:"",hsc(d),d.water||0,d.steps||0,cals,d.mood||0,d.energy||0,d.stress||0,d.bed||"",d.wake||"",HB.filter(h=>(d.h||{})[h.id]).length,String(d.note||"").replace(/"/g,"'")]);
  });
  dlBlob(rows.map(r=>r.map(c=>'"'+String(c)+'"').join(",")).join("\n"),"wellness-"+tod()+".csv","text/csv");
}
function exportJSON(){dlBlob(JSON.stringify(D,null,2),"wellness-"+tod()+".json","application/json");}
function syncToClaude(){
  const d=getDay(),cw=getCW(),sc=hsc(d),bio=getBio(),ar=getAR();
  const msg="DAILY WELLNESS CHECK-IN — "+tod()+
    "\nWeight: "+cw+"kg | Water: "+d.water+" glasses | Steps: "+(d.steps||0)+" | Score: "+sc+"% | Bio Age: "+bio+
    "\nCalories: "+todayCals()+"/"+calTarget()+" kcal | Protein: "+todayProt()+"/"+plan().prot+" g"+
    "\nMood: "+d.mood+"/5 | Energy: "+d.energy+"/5 | Stress: "+d.stress+"/5"+
    "\nSleep: "+(d.bed||"?")+" → "+(d.wake||"?")+
    "\n✅ Done ("+HB.filter(h=>d.h[h.id]).length+"/"+HB.length+"): "+HB.filter(h=>d.h[h.id]).map(h=>h.l).join(", ")+
    "\n❌ Missed: "+HB.filter(h=>!d.h[h.id]).map(h=>h.l).join(", ")+
    "\n🍽️ Meals: "+((d.meals||[]).map(m=>m.t+": "+m.x).join("; ")||"not logged")+
    "\n💪 Exercise: "+(Object.entries(d.ex||{}).map(([n,x])=>x.t==="S"?n+": "+(x.s||[]).map(s=>s.r+"×"+s.w+"kg").join(", "):n+": "+(x.dur||0)+"min").join("; ")||"none")+
    "\n🧘 Breathing: "+((d.br||[]).map(b=>b.n+" at "+b.a).join(", ")||"none")+
    "\n🏃 Race: "+ar.n+" Week "+D.rw+"/"+ar.w+
    "\n📝 Note: "+(d.note||"—")+
    "\n\nPlease log this to Jivanam Supabase and give me feedback.";
  if(typeof sendPrompt==="function")sendPrompt(msg);
}

// ── INIT ──
async function init(){
  await loadData();
  initNav();
  render();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
  });
}
</script>
